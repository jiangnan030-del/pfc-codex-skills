# pfc-sand-small-strain-fabric reference parameters
version: 1.0.0
units: {length: m, mass: kg, force: N, stress: Pa, time: s}
pfc_version: verify_with_pfc_mcp
random_seeds: [10001, 10002, 10003]

specimen:
  shape: cube
  side_m: 0.05
  target_void_ratio: 0.65
  preparation: layered_under_compaction
  gravity: false

particles:
  material: quartz_sand
  equivalent_diameter_min_m: 0.00030
  equivalent_diameter_max_m: 0.00060
  density_kg_m3: 2650
  shape_cases:
    - {name: sphere, aspect_ratio: 1.0, pebble_count: 1}
    - {name: ellipsoid_15, aspect_ratio: 1.5, pebble_count: 5}
    - {name: ellipsoid_20, aspect_ratio: 2.0, pebble_count: 7}
    - {name: ellipsoid_25, aspect_ratio: 2.5, pebble_count: 9}

fabric:
  levels:
    - {name: Ani_I, distribution: uniform_sphere, kappa: 0.0}
    - {name: Ani_II, distribution: planar, kappa: 4.0}
    - {name: Ani_III, distribution: planar, kappa: 12.0}
  # Tune kappa to achieved ad; values are starting points, not paper constants.
  target_plane_normal: [0.0, 0.0, 1.0]
  loading_directions_deg: [0, 45, 90]

contact:
  model: hertz_mindlin
  particle_shear_modulus_Pa: 18.0e9
  particle_poisson_ratio: 0.15
  particle_particle_friction: 0.5
  particle_wall_friction: 0.0
  local_damping_preparation: 0.7
  local_damping_cyclic: sensitivity_study

consolidation:
  confining_pressure_Pa: 100000  # configurable placeholder; confirm source case
  convergence_ratio_average: 1.0e-5

cyclic:
  condition: constant_volume_mechanical_undrained_analogue
  control: axial_strain
  axial_strain_half_amplitude: 3.0e-6
  frequency_Hz: 5.0
  loops: 1
  amplitude_verification: [1.0e-7, 3.0e-7, 1.0e-6, 3.0e-6]
  directions_deg: [0, 45, 90]

outputs:
  histories: [axial_strain, lateral_strain, volume_strain, deviator_stress, mean_pressure]
  fabric: [Rij, aij, ad, principal_direction, Zm, rattler_fraction]
  checks: [kinetic_to_strain_energy, pressure_drift, volume_strain_residual]
  fits: [G0_void_ratio, G0_pressure, directional_modulus_ratio]

save_chain: [clump_templates, fabric_compacted, consolidated, rotated_angle, cyclic_done]
